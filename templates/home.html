<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Burnout Risk Prediction</title>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #f5f7fa, #c3cfe2);
    background: linear-gradient(90deg, #4e54c8 0%, #8f94fb 100%);
    color: #333;
    height: 100vh;
}

.container {
    max-width: 1000px;
    margin: auto;
    padding: 5px 20px;
}

h1 {
    text-align: center;
    font-size: 2.6rem;
    margin-bottom: 35px;
    color: #fff;
    /* color: #2c3e50; */
}

.form-box {
    background: white;
    border-radius: 22px;
    padding: 40px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.15);
}

.form-row {
    display: flex;
    gap: 25px;
    flex-wrap: wrap;
    margin-bottom: 25px;
}

.form-group {
    flex: 1;
    min-width: 220px;
}

label {
    display: block;
    margin-bottom: 8px;
    font-weight: 600;
}

input, select {
    width: 350px;
    padding: 13px 15px;
    font-size: 16px;
    border-radius: 12px;
    border: 2px solid #e1e5eb;
}

select{
    width: 380px;
}

input:focus, select:focus {
    border-color: #667eea;
    outline: none;
    box-shadow: 0 0 0 3px rgba(102,126,234,0.2);
}

small {
    color: #777;
}

button {
    width: 100%;
    margin-top: 15px;
    padding: 16px;
    font-size: 1.1rem;
    font-weight: 600;
    border-radius: 14px;
    border: none;
    cursor: pointer;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white;
    transition: 0.3s;
}

button:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 25px rgba(102,126,234,0.4);
}

.result-box {
    margin-top: 35px;
    background: white;
    border-radius: 22px;
    padding: 40px;
    text-align: center;
    box-shadow: 0 20px 50px rgba(0,0,0,0.15);
}

.score {
    font-size: 4rem;
    font-weight: 700;
    background: linear-gradient(135deg, #667eea, #764ba2);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.low { color: #27ae60; }
.moderate { color: #f39c12; }
.high { color: #e74c3c; }

.error {
    background: #ffebee;
    color: #c62828;
    padding: 15px;
    border-radius: 10px;
    margin-top: 20px;
    text-align: center;
}
</style>
</head>

<body>
<div class="container">
<h1> Predict Burnout Risk</h1>

<div class="form-box">
<form action="/predict" method="post">

<div class="form-row">
    <div class="form-group">
        <label>Day Type</label>
        <select name="day_type" required>
            <option value="Weekday">Weekday</option>
            <option value="Weekend">Weekend</option>
        </select>
    </div>

    <div class="form-group">
        <label>Work Hours</label>
        <input type="number" name="work_hours" min="0" max="24" required>
        <!-- <small>Range: 0 – 100</small> -->
    </div>
</div>

<div class="form-row">
    <div class="form-group">
        <label>Screen Time </label>
        <input type="number" name="screen_time_hours" min="0" max="24" required>
    </div>

    <div class="form-group">
        <label>Meetings</label>
        <input type="number" name="meetings_count" min="0" max="100" required>
    </div>
</div>

<div class="form-row">
    <div class="form-group">
        <label>Breaks Taken</label>
        <input type="number" name="breaks_taken" min="0" max="100" required>
    </div>

    <div class="form-group">
        <label>After Hours Work</label>
        <select name="after_hours_work" required>
            <option value="0">No</option>
            <option value="1">Yes</option>
        </select>
    </div>
</div>

<div class="form-row">
    <div class="form-group">
        <label>Sleep Hours</label>
        <input type="number" name="sleep_hours" min="0" max="24" required>
    </div>

    <div class="form-group">
        <label>Task Completion (%)</label>
        <input type="number" name="task_completion_rate" min="0" max="100" required>
    </div>
</div>

<button type="submit">Predict Burnout</button>
</form>
</div>

{% if error %}
<div class="error">{{ error }}</div>
{% endif %}

{% if results %}
<div class="result-box">
    <h2>Result</h2>
    <div class="score">{{ results }}</div>
    <h3 class="{{ burnout_level|lower }}">{{ burnout_level }} Burnout Risk</h3>
</div>
{% endif %}

</div>
</body>
</html>
